name: python-mirror-tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run mirror test suites (each file is self-running; a failing assert exits non-zero)
        run: |
          set -e
          for f in tests/test_*.py; do echo "== $f"; python "$f"; done
